<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R.Q.S</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      font-family: Arial, sans-serif;
      direction: rtl;
    }


    /* =========================
       TIKTOK IMAGE PAGE
    ========================== */

    #tiktok-page {
      display: none;
      width: 100%;
      min-height: 100vh;

      background: #000;

      justify-content: center;
      align-items: center;
    }

    #tiktok-page img {
      width: 100%;
      max-width: 600px;

      height: 100vh;

      object-fit: contain;

      display: block;

      background: #000;
    }


    /* =========================
       BROWSER CONTACT PAGE
    ========================== */

    #contact-page {
      display: none;

      width: 100%;
      min-height: 100vh;

      background-image:
        linear-gradient(
          rgba(5, 5, 8, 0.35),
          rgba(5, 5, 8, 0.55)
        ),
        url("Picsart_26-08-30_03-52-27-072.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      justify-content: center;
      align-items: center;

      padding: 25px 15px;
    }


    /* =========================
       MAIN CONTAINER
    ========================== */

    .container {
      width: 100%;
      max-width: 650px;

      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 22px;
    }


    /* =========================
       YELLOW BOX
    ========================== */

    .yellow-box {
      width: 100%;

      padding: 22px 20px;

      text-align: center;

      color: #fff;

      font-size: 22px;

      font-weight: bold;

      line-height: 1.8;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 210, 60, 0.38),
          rgba(150, 105, 0, 0.20)
        );

      border: 2px solid rgba(255, 220, 80, 0.9);

      box-shadow:
        0 0 10px rgba(255, 215, 0, 0.8),
        0 0 25px rgba(255, 215, 0, 0.5),
        inset 0 0 25px rgba(255, 220, 80, 0.25);

      backdrop-filter: blur(6px);
    }


    /* =========================
       RED WARNING BOX
    ========================== */

    .red-box {
      width: 100%;

      padding: 20px 18px;

      text-align: center;

      color: #fff;

      font-size: 17px;

      font-weight: bold;

      line-height: 1.9;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 70, 70, 0.45),
          rgba(120, 0, 0, 0.28)
        );

      border: 2px solid rgba(255, 90, 90, 0.9);

      box-shadow:
        0 0 12px rgba(255, 40, 40, 0.75),
        0 0 30px rgba(255, 0, 0, 0.35),
        inset 0 0 25px rgba(255, 80, 80, 0.20);

      backdrop-filter: blur(6px);
    }


    /* =========================
       TELEGRAM + WHATSAPP
    ========================== */

    .buttons-row {
      width: 100%;

      display: flex;

      flex-direction: row;

      justify-content: center;

      align-items: center;

      gap: 14px;

      margin-top: 5px;
    }


    .contact-button {
      width: 48%;

      display: flex;

      justify-content: center;

      align-items: center;

      text-decoration: none;

      background: transparent;

      border: none;

      border-radius: 18px;

      overflow: hidden;

      transition: transform 0.2s ease;

      -webkit-tap-highlight-color: transparent;
    }


    .contact-button:active {
      transform: scale(0.95);
    }


    .contact-button img {
      width: 100%;

      height: auto;

      display: block;

      object-fit: contain;

      border-radius: 18px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 480px) {

      #contact-page {
        padding: 18px 12px;
      }

      .container {
        gap: 18px;
      }

      .yellow-box {
        font-size: 19px;
        padding: 18px 14px;
        border-radius: 10px;
      }

      .red-box {
        font-size: 14px;
        padding: 16px 13px;
        line-height: 1.8;
        border-radius: 10px;
      }

      .buttons-row {
        gap: 10px;
      }

      .contact-button {
        width: 48%;
        border-radius: 14px;
      }

      .contact-button img {
        border-radius: 14px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       TIKTOK IMAGE PAGE
  ========================== -->

  <div id="tiktok-page">

    <img
      src="IMG_20260921_190803_022.jpg?v=2"
      alt="Instruction">

  </div>



  <!-- =========================
       BROWSER CONTACT PAGE
  ========================== -->

  <div id="contact-page">

    <div class="container">


      <div class="yellow-box">
        پەیوەندیم پێوە بکە تا ڕێنمایت بکەم
      </div>


      <div class="red-box">
        ئاگاداربە یەکەم و تاک گروپین عەقدی قانوونی بۆ بەژدار بوو بکەین،
        کە ئەگەر زەرەری کرد تەواوی پەرەکەی پێ بدەینەوە
        و بە پێی یاسا بتوانێ وەری بگرێتەوە
      </div>


      <div class="buttons-row">


        <a
          class="contact-button"
          href="https://t.me/+qLEFaP0lJgE4Yjhi"
          target="_blank"
          rel="noopener noreferrer">

          <img
            src="da03e785ab65fd227457271906a4225c.jpg"
            alt="Telegram">

        </a>


        <a
          class="contact-button"
          href="https://wa.me/966565717120"
          target="_blank"
          rel="noopener noreferrer">

          <img
            src="file_00000000c138824693a99cf3ec0028f8.png"
            alt="WhatsApp">

        </a>


      </div>

    </div>

  </div>



  <!-- =========================
       DETECT TIKTOK
  ========================== -->

  <script>

    const ua = navigator.userAgent || "";

    const isTikTok =
      /TikTok|musical_ly|Bytedance/i.test(ua);


    if (isTikTok) {

      document.getElementById("tiktok-page").style.display = "flex";

      document.getElementById("contact-page").style.display = "none";

    } else {

      document.getElementById("tiktok-page").style.display = "none";

      document.getElementById("contact-page").style.display = "flex";

    }

  </script>


</body>
</html>
