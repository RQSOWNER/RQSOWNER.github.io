
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.Q.S</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    width: 85%;
    max-width: 450px;
    text-align: center;
}

.logo {
    color: #d4af37;
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

.title {
    color: white;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 45px;
}

.button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    margin: 18px 0;
    border-radius: 15px;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    transition: 0.3s;
}

.button:hover {
    transform: scale(1.03);
}

.button i {
    font-size: 27px;
}

/* Telegram Button */
.telegram {
    background: #d4af37;
    color: #000;
}

/* WhatsApp Button */
.whatsapp {
    background: transparent;
    border: 2px solid #d4af37;
    color: #d4af37;
}
</style>

</head>

<body>

<div class="container">

    <div class="logo">R.Q.S 💡</div>

    <div class="title">CONTACT US TO JOIN</div>

    <!-- TELEGRAM -->
    <a class="button telegram" href="TELEGRAM_LINK" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        TELEGRAM
    </a>

    <!-- WHATSAPP -->
    <a class="button whatsapp" href="WHATSAPP_LINK" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
        WHATSAPP
    </a>

</div>

</body>
</html>
