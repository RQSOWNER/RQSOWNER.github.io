<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R.Q.S - Contact Us</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #08090b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* IMAGE BUTTON */

    .image-button {
      display: block;
      width: 75%;
      max-width: 380px;
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .image-button:active {
      transform: scale(0.96);
    }

    .image-button img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .container {
        padding: 20px 15px;
        gap: 18px;
      }

      .image-button {
        width: 80%;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- TELEGRAM BUTTON -->

    <a
      class="image-button"
      href="https://t.me/R_Q_S_grup"
      target="_blank"
      rel="noopener noreferrer">

      <img
        src="da03e785ab65fd227457271906a4225c.jpg"
        alt="Telegram">

    </a>


    <!-- WHATSAPP BUTTON -->

    <a
      class="image-button"
      href="https://wa.me/966565717120"
      target="_blank"
      rel="noopener noreferrer">

      <img
        src="file_00000000c138824693a99cf3ec0028f8.png"
        alt="WhatsApp">

    </a>

  </div>

</body>
</html>
