<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R.Q.S - Contact Us</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #08090b;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* TikTok tutorial image */
    #tutorial {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #000;
    }

    #tutorial img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Contact page */
    #contact {
      display: none;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px 25px;
      text-align: center;
    }

    .logo {
      font-size: 70px;
      font-weight: bold;
      color: #e4b936;
      letter-spacing: 8px;
      margin-bottom: 35px;
      text-shadow: 0 0 20px rgba(228, 185, 54, 0.25);
    }

    .title {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 60px;
      color: #f2f2f2;
    }

    .button {
      width: 100%;
      display: block;
      padding: 28px 20px;
      margin: 22px 0;
      border-radius: 28px;
      text-decoration: none;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .telegram {
      background: #e4b936;
      color: #111;
    }

    .whatsapp {
      background: transparent;
      color: #e4b936;
      border: 3px solid #e4b936;
    }

    .footer {
      margin-top: 45px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      .logo {
        font-size: 55px;
      }

      .title {
        font-size: 25px;
        margin-bottom: 45px;
      }

      .button {
        font-size: 21px;
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- TikTok Browser: Tutorial Image -->
  <div id="tutorial">
    <img
      src="Picsart_26-08-29_21-43-58-372.png"
      alt="Open in browser">
  </div>


  <!-- Chrome / Safari: Contact Page -->
  <div id="contact">

    <div class="container">

      <div class="logo">R.Q.S 💡</div>

      <div class="title">CONTACT US TO JOIN</div>

      <a
        class="button telegram"
        href="https://t.me/R_Q_S_grup"
        target="_blank"
        rel="noopener noreferrer">
        ✈️ TELEGRAM
      </a>

      <a
        class="button whatsapp"
        href="https://wa.me/966565717120"
        target="_blank"
        rel="noopener noreferrer">
        📞 WHATSAPP
      </a>

      <div class="footer">© R.Q.S</div>

    </div>

  </div>


  <script>
    const userAgent = navigator.userAgent || "";

    if (/TikTok|Bytedance|musical_ly/i.test(userAgent)) {
      document.getElementById("tutorial").style.display = "block";
    } else {
      document.getElementById("contact").style.display = "flex";
    }
  </script>

</body>
</html>
