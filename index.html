<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>R.Q.S - Contact Us</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      min-height: 100vh;

      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      /* BACKGROUND IMAGE */
      background-image:
        linear-gradient(
          rgba(10, 8, 30, 0.20),
          rgba(10, 8, 30, 0.20)
        ),
        url("Picsart_26-08-30_03-52-27-072.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    .container {
      width: 100%;
      max-width: 600px;

      padding: 60px 35px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 30px;
    }


    /* BUTTON */
    .button {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      text-decoration: none;

      border-radius: 30px;

      overflow: hidden;

      transition: 0.2s ease;

      -webkit-tap-highlight-color: transparent;
    }


    .button:active {
      transform: scale(0.96);
    }


    /* TELEGRAM IMAGE */
    .telegram img {
      width: 100%;
      max-width: 420px;

      display: block;

      border-radius: 30px;
    }


    /* WHATSAPP IMAGE */
    .whatsapp img {
      width: 100%;
      max-width: 420px;

      display: block;

      border-radius: 30px;
    }


    @media (max-width: 480px) {

      .container {
        padding: 50px 25px;
        gap: 25px;
      }


      .telegram img,
      .whatsapp img {
        max-width: 100%;
        border-radius: 25px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- TELEGRAM BUTTON -->

    <a
      class="button telegram"
      href="https://t.me/R_Q_S_grup"
      target="_blank"
      rel="noopener noreferrer"
    >

      <img
        src="da03e785ab65fd227457271906a4225c.jpg"
        alt="Telegram"
      >

    </a>



    <!-- WHATSAPP BUTTON -->

    <a
      class="button whatsapp"
      href="https://wa.me/966565717120"
      target="_blank"
      rel="noopener noreferrer"
    >

      <img
        src="file_00000000c138824693a99cf3ec0028f8.png"
        alt="WhatsApp"
      >

    </a>


  </div>


</body>
</html>
