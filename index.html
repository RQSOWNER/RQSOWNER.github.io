<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>R.Q.S - Contact Us</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #08090b;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* VIDEO PAGE */
    .video-page {
      width: 100%;
      min-height: 100vh;
      background: #08090b;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      object-fit: contain;
      background: black;
    }

    /* CONTACT PAGE */
    .contact-page {
      display: none;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      background: #08090b;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px 25px;
      text-align: center;
    }

    .logo {
      font-size: 70px;
      font-weight: bold;
      color: #e4b936;
      letter-spacing: 8px;
      margin-bottom: 35px;
    }

    .title {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 60px;
      color: #f2f2f2;
    }

    .button {
      width: 100%;
      display: block;
      padding: 28px 20px;
      margin: 22px 0;
      border-radius: 28px;
      text-decoration: none;
      font-size: 25px;
      font-weight: bold;
    }

    .telegram {
      background: #e4b936;
      color: #111;
    }

    .whatsapp {
      background: transparent;
      color: #e4b936;
      border: 3px solid #e4b936;
    }

    .footer {
      margin-top: 45px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 55px;
      }

      .title {
        font-size: 25px;
      }

      .button {
        font-size: 21px;
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- VIDEO -->
  <div class="video-page">
    <video
      controls
      playsinline
      autoplay
      muted>
      <source src="lv_0_20260830032357.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
  </div>


  <!-- CONTACT -->
  <div class="contact-page">

    <div class="container">

      <div class="logo">R.Q.S 💡</div>

      <div class="title">CONTACT US TO JOIN</div>

      <!-- TELEGRAM -->
      <a
        class="button telegram"
        href="https://t.me/R_Q_S_grup"
        target="_blank"
        rel="noopener noreferrer">
        ✈️ TELEGRAM
      </a>

      <!-- WHATSAPP -->
      <a
        class="button whatsapp"
        href="https://wa.me/966565717120"
        target="_blank"
        rel="noopener noreferrer">
        📞 WHATSAPP
      </a>

      <div class="footer">© R.Q.S</div>

    </div>

  </div>

</body>
</html>
