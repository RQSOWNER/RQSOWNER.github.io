<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.Q.S</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 600px;
    padding: 45px 25px;
    text-align: center;
}

.logo {
    font-size: 65px;
    font-weight: bold;
    color: #e4b936;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

.title {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 55px;
}

.button {
    width: 100%;
    display: block;
    padding: 25px 15px;
    margin-bottom: 22px;
    border-radius: 22px;
    text-decoration: none;
    font-size: 22px;
    font-weight: bold;
}

.browser {
    background: #e4b936;
    color: #111;
}

.telegram {
    background: #e4b936;
    color: #111;
}

.whatsapp {
    background: transparent;
    color: #e4b936;
    border: 3px solid #e4b936;
}

.note {
    color: #cfcfcf;
    font-size: 15px;
    line-height: 1.6;
    margin-top: 5px;
}

#browserSection,
#contactSection {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">R.Q.S 💡</div>

    <div class="title">CONTACT US TO JOIN</div>

    <!-- TIKTOK SECTION -->
    <div id="browserSection">

        <a href="#" class="button browser" onclick="openExternalBrowser(); return false;">
            🌐 OPEN IN BROWSER
        </a>

        <div class="note">
            Open this page in your browser to contact us.
        </div>

    </div>

    <!-- NORMAL BROWSER SECTION -->
    <div id="contactSection">

        <a class="button telegram"
           href="https://t.me/R_Q_S_grup"
           target="_blank"
           rel="noopener noreferrer">
            ✈️ TELEGRAM
        </a>

        <a class="button whatsapp"
           href="https://wa.me/96656571720"
           target="_blank"
           rel="noopener noreferrer">
            ☎️ WHATSAPP
        </a>

    </div>

</div>

<script>
const ua = navigator.userAgent.toLowerCase();
const isTikTok = ua.includes("tiktok");

if (isTikTok) {
    document.getElementById("browserSection").style.display = "block";
} else {
    document.getElementById("contactSection").style.display = "block";
}

function openExternalBrowser() {

    const url = "https://rqsowner.github.io/";

    const isAndroid = /android/i.test(navigator.userAgent);

    if (isAndroid) {

        window.location.href =
        "intent://rqsowner.github.io/#Intent;scheme=https;package=com.android.chrome;end";

        setTimeout(function () {
            window.location.href = url;
        }, 1200);

    } else {

        window.open(url, "_blank");

    }
}
</script>

</body>
</html>
